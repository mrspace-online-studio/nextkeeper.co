<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Next Keeper · The shelter opens soon</title>
  <meta name="description" content="Next Keeper is a shelter for clothes with a past. One-of-a-kind pieces, each with a story, waiting for their next keeper. Opening soon in Venice Beach.">
  <meta property="og:title" content="Next Keeper · The shelter opens soon">
  <meta property="og:description" content="We don't sell clothes. We sell what they've been through. Probably.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%2240 20 320 190%22%3E%3Cpath d=%22M200 104V90c0-10 16-16 16-34 0-18-13-28-26-28-14 0-22 10-22 22M200 110c-24 14-90 46-136 66-14 6-14 18 2 18h268c16 0 16-12 2-18-46-20-112-52-136-66%22 fill=%22none%22 stroke=%22%2313201F%22 stroke-width=%2214%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Geist+Mono&family=Instrument+Serif:ital@0;1&family=Jost:wght@500&display=swap">
  <style>
    :root{--bg:#F3F2ED;--ink:#13201F;--ink-2:#5A6866;--accent:#493B46;--line:#CFD1C8}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Instrument Serif",Georgia,serif;display:grid;place-items:center;padding:24px 16px;-webkit-font-smoothing:antialiased}
    main{width:min(560px,100%);text-align:center}
    .seal{width:min(380px,86%);margin:0 auto 8px}
    .seal svg{display:block;width:100%;height:auto}
    .mono{font:12px/1.6 "Geist Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
    h1{font-weight:400;font-size:clamp(38px,9vw,64px);line-height:1;margin:18px 0 18px;letter-spacing:-.01em}
    h1 em{font-style:italic}
    p.lede{font-size:clamp(19px,4.6vw,23px);line-height:1.35;margin:0 auto 26px;max-width:28ch}
    .rule{width:64px;height:1px;background:var(--accent);margin:26px auto}
    .motto{font-style:italic;font-size:19px;margin:0 0 4px}
    footer{margin-top:40px}
  </style>
</head>
<body>
<main>
  <div class="seal">
    <svg viewBox="0 0 760 450" role="img" aria-label="Next Keeper, Home for Wayward Garments">
      <defs><path id="arc" d="M128 330a252 252 0 0 1 504 0"/></defs>
      <text font-family="Jost,sans-serif" font-weight="500" font-size="22" letter-spacing="7.5" fill="#13201F"><textPath href="#arc" startOffset="50%" text-anchor="middle">HOME FOR WAYWARD GARMENTS</textPath></text>
      <circle cx="148" cy="236" r="3.5" fill="#493B46"/><circle cx="612" cy="236" r="3.5" fill="#493B46"/>
      <g transform="translate(220 84) scale(.8)"><path d="M200 104V90c0-10 16-16 16-34 0-18-13-28-26-28-14 0-22 10-22 22M193 98l14 5M193 106l14 5M200 110c-24 14-90 46-136 66-14 6-14 18 2 18h268c16 0 16-12 2-18-46-20-112-52-136-66" fill="none" stroke="#13201F" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="168" cy="51" r="3.6" fill="#13201F"/></g>
      <text x="380" y="380" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,serif" font-style="italic" font-weight="500" font-size="112" fill="#13201F">Next Keeper</text>
      <line x1="210" y1="424" x2="300" y2="424" stroke="#493B46" stroke-width="1.6"/><line x1="460" y1="424" x2="550" y2="424" stroke="#493B46" stroke-width="1.6"/>
      <text x="380" y="430" text-anchor="middle" font-family="Jost,sans-serif" font-size="16" letter-spacing="5" fill="#493B46">EST. 2026</text>
    </svg>
  </div>
  <p class="mono">Venice Beach, California</p>
  <h1>The shelter opens <em>soon.</em></h1>
  <p class="lede">We're taking in the residents, mending what needs mending and writing down their stories. Each one is waiting for its next keeper.</p>
  <div class="rule" aria-hidden="true"></div>
  <p class="motto">We don't sell clothes.<br>We sell what they've been through. Probably.</p>
  <footer><p class="mono">Next Keeper by Heron CA</p></footer>
</main>
<!-- nk-studio-door -->
<script>
(function(){var el=document.querySelector('.seal')||document.querySelector('svg');if(!el)return;var n=0,t;
el.addEventListener('click',function(){n++;clearTimeout(t);t=setTimeout(function(){n=0},1500);if(n>=3){location.href='/studio/';}});})();
</script>
</body>
</html>
